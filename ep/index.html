(function(){
  var c = document.getElementById('ldmoon'), g = c.getContext('2d'), N = 144, r = 58, cx = N / 2, cy = N / 2, t0 = performance.now();
  window.__load = { n: 0, total: 7, step: function(){ this.n++; var b = document.querySelector('#loader .bar i'); if (b) b.style.width = Math.min(100, this.n / this.total * 100) + '%'; } };
  function frame(now){
    var L = document.getElementById('loader'); if (!L || L.dataset.done) return;
    var ph = ((now - t0) / 4200 % 1) * Math.PI * 2, k = Math.cos(ph), waxing = ph < Math.PI;
    g.clearRect(0, 0, N, N);
    g.fillStyle = '#121212'; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();            // the dark side, faintly there
    g.strokeStyle = 'rgba(233,230,223,.16)'; g.lineWidth = 1; g.stroke();
    g.save(); g.translate(cx, cy); if (!waxing) g.scale(-1, 1);
    var gr = g.createRadialGradient(-r * .25, -r * .3, r * .1, 0, 0, r); gr.addColorStop(0, '#e9e6df'); gr.addColorStop(1, '#8d8b85');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
    g.ellipse(0, 0, Math.max(.01, r * Math.abs(k)), r, 0, Math.PI / 2, -Math.PI / 2, k > 0); g.closePath(); g.fill(); g.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
