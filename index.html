<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ya Leil Sky</title>
<meta name="theme-color" content="#0a0b0a">
<!-- start fetching the 3D engine and the small textures at once -->
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" crossorigin>
<link rel="preload" as="image" href="milkyway-lo.jpg"><link rel="preload" as="image" href="moon-lo.jpg"><link rel="preload" as="image" href="cover-lo.jpg">
<link rel="preload" as="font" href="ka-hand-naskh.ttf" type="font/ttf" crossorigin>
<style>
/* Layout: the whole screen is a live 3D sky (moved by the phone's motion): the real sun, moon and Milky Way over desert hills, with Ya Leil as a constellation to draw.
   Subtitles sit low; one bottom row holds the face toggle, the compass and the record button. Single deliberate dark look. */
@font-face{font-family:"KA Hand Naskh";src:url("ka-hand-naskh.ttf") format("truetype");font-display:swap}
:root{--void:#0a0b0a;--paper:#efeae0;--mute:#a9ada6;--line:rgba(239,234,224,.4);--accent:#c9cfc4;--rec:#c8321e;
  --f-ar:"KA Hand Naskh","Noto Naskh Arabic","Geeza Pro",serif;--f-en:-apple-system,"Helvetica Neue",Arial,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--void);color:var(--paper);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.sub{position:fixed;z-index:3;left:0;right:0;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 92px);text-align:center;pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.75);
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.sub .ar{display:block;font-family:var(--f-ar);font-size:20px;line-height:1.4}
.sub .en{display:block;font:400 12.5px/1.5 var(--f-en);letter-spacing:.06em;color:var(--mute);direction:ltr}
#arrow{position:fixed;z-index:3;left:0;top:0;width:52px;height:52px;margin:-26px 0 0 -26px;pointer-events:none;color:var(--paper);filter:drop-shadow(0 0 8px rgba(0,0,0,.7))}
.row{direction:ltr;position:fixed;z-index:4;left:0;right:0;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 14px);display:flex;align-items:center;justify-content:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.round{width:52px;height:52px;flex:none;border-radius:50%;border:1px solid var(--line);background:rgba(10,11,10,.55);color:var(--paper);display:grid;place-items:center;padding:0;cursor:pointer;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.round[aria-pressed="true"]{background:var(--paper);color:var(--void)}
#rec span{width:22px;height:22px;border-radius:50%;background:var(--rec);transition:all .25s}
#rec.on span{width:16px;height:16px;border-radius:4px}
#rec.call{animation:call 1.4s ease-in-out infinite}
@keyframes call{50%{box-shadow:0 0 0 8px rgba(239,234,224,.16)}}
#rec svg{position:absolute;width:52px;height:52px;transform:rotate(-90deg);pointer-events:none}
#rec{position:relative}
.compass{direction:ltr;position:relative;flex:1 1 auto;max-width:220px;height:52px;border:1px solid var(--line);border-radius:999px;background:rgba(10,11,10,.55);overflow:hidden;pointer-events:none;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.compass .strip{position:absolute;top:0;bottom:0;left:50%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.compass .t{width:15px;flex:none;display:flex;justify-content:center}
.compass .t i{display:block;width:1px;background:rgba(239,234,224,.35)}
.compass .t.c b{font:500 13px/1 var(--f-en);color:var(--paper);letter-spacing:.04em}
.compass .needle{position:absolute;left:50%;top:9px;bottom:9px;width:2px;margin-left:-1px;background:var(--accent);border-radius:1px}
.compass:before,.compass:after{content:"";position:absolute;top:0;bottom:0;width:44px;z-index:1}
.compass:before{left:0;background:linear-gradient(90deg,rgba(10,11,10,.95),transparent)}
.compass:after{right:0;background:linear-gradient(-90deg,rgba(10,11,10,.95),transparent)}
.credit{position:fixed;z-index:3;top:max(8px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));font:400 9px/1 var(--f-en);letter-spacing:.06em;color:rgba(239,234,224,.3);pointer-events:none;direction:ltr}
/* start */
#start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;background:var(--void);isolation:isolate;overflow:hidden;
  padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
#start h1{margin:0;font:400 46px/1.2 var(--f-ar)}
#start .kicker{font:500 11px/1 var(--f-en);letter-spacing:.32em;color:var(--mute);margin-top:-12px;direction:ltr}
#start p{margin:0;max-width:30ch;font:400 18px/1.7 var(--f-ar);color:var(--mute)}
#start p.en{font:400 14px/1.6 var(--f-en);direction:ltr}
.go{font-family:var(--f-ar);font-size:20px;color:var(--void);background:var(--paper);border:0;border-radius:999px;padding:12px 28px;cursor:pointer;box-shadow:0 8px 40px rgba(0,0,0,.45)}
/* both screens wear the cover: a blurred, darkened copy fills the screen, the sharp cover sits centred on top */
#sheet::before{content:"";position:absolute;inset:-80px;z-index:-2;background:url("sleeve.jpg") center/cover;filter:blur(36px) brightness(.72) saturate(.85)}
#sheet::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:url("sleeve.jpg") center/min(118vw,94vh) no-repeat;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 min(40vw,31vh),transparent min(58vw,46vh));mask-image:radial-gradient(circle at 50% 50%,#000 min(40vw,31vh),transparent min(58vw,46vh))}   /* the cover's edges dissolve into its blurred copy */
#sheet::after{opacity:.28}
/* start: the live sky behind a soft vignette, and a moon-like button wrapped in the cover's ring */
#start{background:radial-gradient(120% 75% at 50% 48%,transparent 35%,rgba(5,6,5,.75) 100%)!important}
body.pre .sub,body.pre .credit,body.pre #arrow{opacity:0}
.orb{position:relative;width:132px;height:132px;border-radius:50%;border:0;padding:0;cursor:pointer;color:var(--paper);
  background:url("cover-lo.jpg") center/220px 220px,radial-gradient(circle,#4a4c48,#3c3e3b 70%,#333532);box-shadow:inset 0 0 26px rgba(0,0,0,.65),0 0 0 1px rgba(239,234,224,.22);display:grid;place-items:center;isolation:isolate;-webkit-tap-highlight-color:transparent}
.orb .halo{position:absolute;left:50%;top:50%;width:184px;height:184px;margin:-92px 0 0 -92px;border-radius:50%;z-index:-1;pointer-events:none;   /* sized so the ribs start right at the button's edge */
  background:url("cover-lo.jpg") center/184px 184px,repeating-conic-gradient(rgba(150,156,148,.55) 0 .35deg,rgba(40,42,40,.2) .35deg 1.1deg);mix-blend-mode:screen;opacity:.85;filter:brightness(1.6) contrast(1.2);
  -webkit-mask-image:radial-gradient(circle closest-side,transparent 71.4%,#000 72%,#000 96%,transparent 100%);mask-image:radial-gradient(circle closest-side,transparent 71.4%,#000 72%,#000 96%,transparent 100%);
  animation:turn 120s linear infinite}
.orb .glow{position:absolute;left:50%;top:50%;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;z-index:-2;pointer-events:none;
  background:radial-gradient(circle,rgba(225,230,222,.16) 30%,rgba(225,230,222,.05) 50%,transparent 70%);animation:breathe 4.5s ease-in-out infinite}
.orb .lbl{display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.orb .lbl b{font:400 26px/1 var(--f-ar)}
.orb .lbl i{font:500 10px/1 var(--f-en);font-style:normal;letter-spacing:.32em;color:rgba(239,234,224,.75);padding-left:.32em}
.orb:active{transform:scale(.97)}
.orb:focus-visible{outline:1px solid var(--paper);outline-offset:8px}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.08);opacity:.7}}
#sheet::before{filter:blur(36px) brightness(.38) saturate(.85)}
#clip{box-shadow:0 20px 60px rgba(0,0,0,.6);border:1px solid rgba(239,234,224,.18)}
#sheet .ghost{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);background:rgba(10,11,10,.35)}
.go .en,.en{font-family:var(--f-en);letter-spacing:.02em}
/* clip sheet */
#sheet{position:fixed;inset:0;z-index:30;background:var(--void);isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#clip{max-height:68vh;max-width:100%;border-radius:14px;background:#000}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ghost{font:400 16px/1 var(--f-en);color:var(--paper);background:transparent;border:1px solid var(--line);border-radius:999px;padding:12px 22px;cursor:pointer}
.go.en{font:500 16px/1 var(--f-en);padding:12px 26px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="pre">
<canvas id="c" aria-label="A live sky with the moon and the letters of Ya Leil as a constellation"></canvas>
<div class="sub" id="sub" aria-live="polite"><span class="ar" id="subAr"></span><span class="en" id="subEn"></span></div>
<svg id="arrow" viewBox="-26 -26 52 52" hidden aria-hidden="true"><path d="M0,-18 L13,9 L0,3 L-13,9Z" fill="currentColor"/></svg>
<span class="credit">Milky Way: ESO/S. Brunier</span>
<div class="row" id="row" hidden>
  <button class="round" id="face" type="button" aria-pressed="false" aria-label="Add your face to the sky"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="9" r="4"/><path d="M4.5 20c1.3-3.6 4.2-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/></svg></button>
  <div class="compass" aria-hidden="true"><div class="strip" id="strip"></div><div class="needle"></div></div>
  <button class="round" id="rec" type="button" aria-label="Record a clip"><span></span><svg viewBox="0 0 52 52" aria-hidden="true"><circle id="recArc" cx="26" cy="26" r="24.5" fill="none" stroke="#efeae0" stroke-width="2" stroke-dasharray="153.9" stroke-dashoffset="153.9"/></svg></button>
</div>
<section id="start">
  <button class="orb" id="go" type="button" aria-label="ابدأ · Start"><span class="glow" aria-hidden="true"></span><span class="halo" aria-hidden="true"></span><span class="lbl"><b>ابدأ</b><i>START</i></span></button>
</section>
<section id="sheet" hidden>
  <video id="clip" playsinline loop autoplay></video>
  <div class="btns">
    <button class="go en" id="share" type="button">Share</button>
    <button class="ghost" id="save" type="button">Save</button>
    <button class="ghost" id="again" type="button">Try again</button>
  </div>
</section>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
/* ============ CONFIG ============ */
const CONFIG={
  title:"يا ليل",titleEn:"Ya Leil",
  releaseAr:"١٥ نوفمبر",releaseEn:"15 November",
  others:["مهرب","ازاي اسيب","النهاية","مساحات","خسرت نفسي","فاكراه"],   // faint, untappable letters of the other songs
  fallback:{lat:30.0444,lng:31.2357},   // Cairo, when location is refused
  declination:4.5,                      // magnetic → true north (degrees east, Cairo)
  clipSeconds:15,
  tonightHour:21,                       // daytime: mark where the moon will be at this hour tonight
  snippet:null                          // e.g. "ya-leil.mp3" next to this page; null = placeholder tone

/* ================================ */
const $=id=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const RAD=Math.PI/180;
const AD=s=>String(s).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);

let geo={...CONFIG.fallback};

/* ---------- astronomy (low precision, about a degree): sun, moon, galactic frame for any time and place ---------- */
const DAYMS=864e5,J1970=2440588,J2000=2451545,OBL=RAD*23.4397;
const raOf=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(OBL)-Math.tan(b)*Math.sin(OBL),Math.cos(l));
const decOf=(l,b)=>Math.asin(Math.sin(b)*Math.cos(OBL)+Math.cos(b)*Math.sin(OBL)*Math.sin(l));
function skyAt(t){
  const d=t/DAYMS-.5+J1970-J2000,LST=RAD*(280.16+360.9856235*d)+RAD*geo.lng,phi=geo.lat*RAD;
  const eq=(ra,dec)=>{const H=LST-ra,alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
    const az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi))+Math.PI;return dirAA(alt,az)};
  const M=RAD*(357.5291+.98560028*d),C=RAD*(1.9148*Math.sin(M)+.02*Math.sin(2*M)+.0003*Math.sin(3*M)),ls=M+C+RAD*102.9372+Math.PI;
  const Lm=RAD*(218.316+13.176396*d),Mm=RAD*(134.963+13.064993*d),Fm=RAD*(93.272+13.22935*d),lm=Lm+RAD*6.289*Math.sin(Mm),bm=RAD*5.128*Math.sin(Fm);
  return {sun:eq(raOf(ls,0),decOf(ls,0)),moon:eq(raOf(lm,bm),decOf(lm,bm)),ngp:eq(192.85948*RAD,27.12825*RAD),gc:eq(266.40499*RAD,-28.93617*RAD)};
}
const altOf=v=>Math.asin(Math.max(-1,Math.min(1,v.y))),azOf=v=>Math.atan2(v.x,-v.z);

/* ---------- renderer and scene ---------- */
const canvas=$("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:false});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,1,1,60000);scene.add(camera);
let SKY=skyAt(Date.now());

/* sky dome: day blue → twilight → night violet, with the real Milky Way photograph (ESO) at night */
const mwTex=new THREE.TextureLoader().load("milkyway-lo.jpg");mwTex.colorSpace=THREE.SRGBColorSpace;mwTex.wrapS=THREE.RepeatWrapping;mwTex.anisotropy=8;
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
  uniforms:{uSun:{value:SKY.sun},uMoon:{value:SKY.moon},uNGP:{value:SKY.ngp},uGC:{value:SKY.gc},uMW:{value:mwTex},uEtch:{value:1}},
  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 uSun,uMoon,uNGP,uGC;uniform sampler2D uMW;uniform float uEtch;varying vec3 vD;
    float h1(float x){return fract(sin(x*127.1)*43758.5453);}
    void main(){vec3 d=normalize(vD);float h=d.y,ah=abs(h),sy=uSun.y;
      float night=clamp((-sy-.02)/.26,0.,1.),day=clamp((sy+.04)/.14,0.,1.);
      vec3 zenN=vec3(.0055,.006,.0055),horN=vec3(.034,.037,.032),zenD=vec3(.13,.15,.16),horD=vec3(.34,.36,.33);   // the cover's palette: charcoal → sleeve grey-sage; a pale stone sky by day
      vec3 c=mix(mix(horN,zenN,smoothstep(0.,.75,ah)),mix(horD,zenD,smoothstep(0.,.6,ah)),day);
      vec2 sh=normalize(uSun.xz+1e-5),dh=normalize(d.xz+1e-5);float toward=max(dot(sh,dh),0.);
      float band=exp(-max(h,0.)*9.)*smoothstep(-.02,.0,h),band2=exp(-max(h,0.)*16.)*smoothstep(-.02,.0,h);
      float dusk=(1.-night)*(1.-day*.85);

      vec3 e2=normalize(cross(uNGP,uGC));float gb=asin(clamp(dot(d,uNGP),-1.,1.)),gl=atan(dot(d,e2),dot(d,uGC));
      vec3 mw=texture2D(uMW,vec2(.5-gl/6.2831853,.5+gb/3.14159265)).rgb;mw=mix(vec3(dot(mw,vec3(.3,.59,.11))),mw,.12)*vec3(.97,1.,.95);   // monochrome, like the print

      c+=mw*1.25*wash*night*(h<0.?.45:1.);
      float m=max(dot(d,uMoon),0.);c+=vec3(.06,.06,.06)*pow(m,140.)*(1.-day*.7)+vec3(.008,.008,.008)*pow(m,10.);
      // etched lines: fine radial strokes spreading out from the moon, like the brushed lines on the cover
      {vec3 mu=normalize(uMoon),ax=normalize(cross(mu,vec3(0.,1.,0.)+1e-4)),ay=cross(ax,mu);
        float ang=atan(dot(d,ay),dot(d,ax)),dist=acos(clamp(dot(d,mu),-1.,1.)),k=ang*286.4789,id=floor(k),f=fract(k);
        float on=step(.62,h1(id)),len=.12+.5*h1(id+3.1),w=.18+.25*h1(id+7.7);
        c+=vec3(.8,.82,.78)*on*smoothstep(w,0.,abs(f-.5))*smoothstep(.07,.1,dist)*smoothstep(len,len*.4,dist)*.035*uEtch*(1.-day)*(h<0.?.4:1.);}
      if(h<0.)c=mix(c,mix(vec3(.005,.0055,.005),vec3(.1,.11,.1),day),smoothstep(0.,.25,-h)*.6);
      gl_FragColor=vec4(c,1.);
      #include <colorspace_fragment>
    }`});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(40000,128,64),skyMat));

/* a sprinkle of twinkling stars, hidden by day */
const starsMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{t:{value:0},px:{value:renderer.getPixelRatio()},uSun:{value:SKY.sun}},
  vertexShader:`attribute float size,ph;uniform float t,px;uniform vec3 uSun;varying float vA;
    void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;vec3 d=normalize(position);
      float night=clamp((-uSun.y-.02)/.26,0.,1.);float tw=.6+.4*sin(t*(1.3+ph*.4)+ph*9.);
      float glow=pow(max(dot(normalize(d.xz),normalize(uSun.xz)),0.),2.)*exp(-max(d.y,0.)*5.);
      vA=tw*night*(d.y<0.?.4:1.)*(1.-.9*glow);gl_PointSize=size*px;}`,
  fragmentShader:`varying float vA;void main(){float d=length(gl_PointCoord-.5);float a=exp(-d*d*26.)+exp(-d*d*5.)*.18;gl_FragColor=vec4(vec3(.95,.96,.93)*a*vA,a*vA);}`});
{const N=4200,pos=new Float32Array(N*3),sz=new Float32Array(N),ph=new Float32Array(N),v=new THREE.Vector3();
  for(let i=0;i<N;i++){do{v.set(Math.random()*2-1,Math.random()*2-1,Math.random()*2-1)}while(v.lengthSq()>1||v.lengthSq()<.01);v.normalize();
    pos.set([v.x*30000,v.y*30000,v.z*30000],i*3);{const r=Math.random();sz[i]=r>.993?6:r>.95?3.4:Math.pow(Math.random(),2)*2+1.1}ph[i]=Math.random()*6.28}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("size",new THREE.BufferAttribute(sz,1));g.setAttribute("ph",new THREE.BufferAttribute(ph,1));
  scene.add(new THREE.Points(g,starsMat))}
/* zoom streaks: while you zoom, stars stretch into lines that rush out of (or into) the centre of the view */
const streakMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,uniforms:{uW:{value:0}},
  vertexShader:`attribute float e,b;uniform float uW;varying float vA;
    void main(){vec4 c=projectionMatrix*modelViewMatrix*vec4(position,1.);
      if(e>.5&&c.w>0.){vec2 n=c.xy/c.w;n*=1.-clamp(uW,-.6,.6);c.xy=n*c.w;}   // the tail sits where the star just was
      vA=b*(e>.5?.0:1.)*min(abs(uW)*5.,1.);gl_Position=c;}`,
  fragmentShader:`varying float vA;void main(){gl_FragColor=vec4(vec3(.92,.94,.9)*vA,vA);}`});
{const N=2600,pos=new Float32Array(N*6),e=new Float32Array(N*2),b=new Float32Array(N*2),v=new THREE.Vector3();
  for(let i=0;i<N;i++){do{v.set(Math.random()*2-1,Math.random()*2-1,Math.random()*2-1)}while(v.lengthSq()>1||v.lengthSq()<.01);v.normalize();
    const br=.25+.75*Math.pow(Math.random(),3);pos.set([v.x*29000,v.y*29000,v.z*29000,v.x*29000,v.y*29000,v.z*29000],i*6);e.set([0,1],i*2);b.set([br,br],i*2)}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("e",new THREE.BufferAttribute(e,1));g.setAttribute("b",new THREE.BufferAttribute(b,1));
  const streaks=new THREE.LineSegments(g,streakMat);streaks.frustumCulled=false;streaks.renderOrder=5;scene.add(streaks)}

  toThree(mul(R,[Math.cos(ang),-Math.sin(ang),0]),vR);toThree(mul(R,[Math.sin(ang),Math.cos(ang),0]),vU);toThree(mul(R,[0,0,1]),vB);

}
async function startOrientation(){
  try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function"){const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted")return}}catch(e){return}
  addEventListener("ondeviceorientationabsolute" in window?"deviceorientationabsolute":"deviceorientation",onOrient);
}
let yaw=anchorAz,pitch=Math.max(anchorAlt+8*RAD,20*RAD),vy=0,vp=0,drag=null;
function starAt(x,y){let best=null,bd=46;const p=new THREE.Vector3();stars.forEach(s=>{p.copy(s.position).project(camera);if(p.z>1)return;
  const d=Math.hypot((p.x+1)/2*innerWidth-x,(1-p.y)/2*innerHeight-y);if(d<bd){bd=d;best=s}});return best}
function titleTapped(x,y){if(!titleLabel)return false;const p=titleLabel.position.clone().project(camera);return p.z<1&&Math.hypot((p.x+1)/2*innerWidth-x,(1-p.y)/2*innerHeight-y)<90}
const touches=new Map();let pinch=null,lastTap=0;
const spread=()=>{const a=[...touches.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
canvas.addEventListener("pointerdown",e=>{audio.ctx&&audio.ctx.resume();touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===2){pinch={d0:spread(),z0:ZOOM.t};if(drag)drag.moved=true;return}   // two fingers: pinch to zoom
  drag={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&touches.size>=2){setZoom(pinch.z0*pinch.d0/Math.max(20,spread()))}});
canvas.addEventListener("wheel",e=>{e.preventDefault();setZoom(ZOOM.t*Math.exp(e.deltaY*.0016))},{passive:false});
addEventListener("pointercancel",e=>{touches.delete(e.pointerId);if(touches.size<2)pinch=null});
canvas.addEventListener("pointermove",e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>8)drag.moved=true;if(!drag.moved||ORI.ok)return;
  const k=camera.fov*RAD/Math.max(360,innerHeight)*1.1;vy=-(e.clientX-drag.x)*k;vp=(e.clientY-drag.y)*k;yaw+=vy;pitch+=vp;drag.x=e.clientX;drag.y=e.clientY});
addEventListener("pointerup",e=>{touches.delete(e.pointerId);const wasPinch=!!pinch;if(touches.size<2)pinch=null;
  if(drag&&!drag.moved&&!wasPinch){const s=starAt(e.clientX,e.clientY);
    if(s)tapStar(s);else if(solved&&titleTapped(e.clientX,e.clientY))playSnippet();
    else{const n=performance.now();if(n-lastTap<320){setZoom(ZOOM.t>.7?.42:1);lastTap=0}else lastTap=n}}   // double-tap the sky: jump in / back out
  drag=null});

/* ---------- subtitles and guidance ---------- */
let riseCache={t:0,v:null};
function moonRise(){const n=Date.now();if(n-riseCache.t>6e4){riseCache.t=n;riseCache.v=null;let prev=skyAt(n).moon.y;
    for(let m=10;m<=30*60;m+=10){const y=skyAt(n+m*6e4).moon.y;if(prev<=0&&y>0){riseCache.v=n+m*6e4;break}prev=y}}
  const v=riseCache.v;return v?{ar:AD(new Intl.DateTimeFormat("ar-EG-u-nu-latn",{hour:"numeric",minute:"2-digit"}).format(v)),en:new Intl.DateTimeFormat("en-GB",{hour:"numeric",minute:"2-digit"}).format(v)}:null}
let sayUntil=0;
function say(pair,ms){$("subAr").textContent=pair[0];$("subEn").textContent=pair[1];if(ms)sayUntil=performance.now()+ms}
const SUB={find:["المس النجوم بالترتيب عشان ترسم اسم الأغنية","Tap the stars in order to draw the song's title"],
  going:["كمّل · المس آخر نجمة عشان ترجع خطوة","Keep going · tap the last star to step back"],
  wrong:["مش بالترتيب ده · جرّب تاني","Not in that order · try again"],
  solved:[`${CONFIG.title} · سجّل وانت بتسمعها`,`${CONFIG.titleEn} · record it while you listen`]};
function guide(){
  if(performance.now()<sayUntil)return;
  const c=new THREE.Vector3();stars.forEach(s=>c.add(s.position));if(!stars.length)return;c.normalize().multiplyScalar(18000);
  const inView=v=>{const q=v.clone().project(camera);return q.z<1&&Math.abs(q.x)<.9&&Math.abs(q.y)<.85};
  const ar=$("arrow"),on=inView(c)||inView(moon.position)||stars.some(st=>inView(st.position));   // on target when the moon or any of its stars is in view
  const down=SKY.moon.y<0,r=down?moonRise():null;
  if(on||rec&&rec.state==="recording"){ar.setAttribute("hidden","");
    if(state==="find"&&down&&r)say([`القمر تحت الأفق لحد الساعة ${r.ar} · المس النجوم بالترتيب`,`The moon is below the horizon until ${r.en} · tap the stars in order`]);
    else say(SUB[state]||SUB.find);return}
  // off screen: an arrow at the edge and words for the way to turn
  const v=c.clone().applyMatrix4(camera.matrixWorldInverse);let ang=Math.atan2(-v.y,v.x);if(v.z>0&&Math.abs(v.x)<1e-3)ang=-Math.PI/2;
  const W=innerWidth,H=innerHeight,ex=W/2+Math.cos(ang)*(W/2-44),ey=H/2+Math.sin(ang)*(H/2-150);
  ar.removeAttribute("hidden");ar.style.transform=`translate(${ex}px,${ey}px) rotate(${ang+Math.PI/2}rad)`;
  const horiz=Math.abs(Math.cos(ang))>Math.abs(Math.sin(ang));
  const dAr=horiz?(Math.cos(ang)>0?"لف يمين":"لف شمال"):(Math.sin(ang)<0?"ارفع لفوق":"نزّل لتحت"),dEn=horiz?(Math.cos(ang)>0?"turn right":"turn left"):(Math.sin(ang)<0?"tilt up":"tilt down");
  if(down)say([`القمر ونجومه تحت الأفق · ${dAr}`,`The moon and its stars are below the horizon · ${dEn}`]);
  else say([`القمر ونجومه هناك · ${dAr}`,`The moon and its stars are that way · ${dEn}`]);
}

/* ---------- compass bar ---------- */
{const NAMES={0:"N",45:"NE",90:"E",135:"SE",180:"S",225:"SW",270:"W",315:"NW"};let html="";
  for(let rep=0;rep<3;rep++)for(let d=0;d<360;d+=5){const n=NAMES[d];html+=n?`<span class="t c"><b>${n}</b></span>`:`<span class="t"><i style="height:${d%15===0?11:6}px"></i></span>`}
  $("strip").innerHTML=html}

/* ---------- loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;ZOOM.base=w<h?72:56;camera.fov=ZOOM.base*ZOOM.k;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
const clock=new THREE.Clock();let lastSky=0;
const fwd=new THREE.Vector3();
function frame(){
  const t=clock.getElapsedTime(),now=performance.now();
  if(now-lastSky>30000){lastSky=now;SKY=skyAt(Date.now());skyMat.uniforms.uSun.value=SKY.sun;skyMat.uniforms.uMoon.value=SKY.moon;skyMat.uniforms.uNGP.value=SKY.ngp;skyMat.uniforms.uGC.value=SKY.gc;
    starsMat.uniforms.uSun.value=SKY.sun;moon.material.uniforms.uL.value=SKY.sun;placeMoon();
    if(!seq.length&&!solved){chooseAnchor();stars.forEach((s,i)=>s.position.copy(starDir(i)).multiplyScalar(18000))}   // follow the moon until the game starts
    const dayish=SKY.sun.y>-.1;if(dayish&&!pathInfo)buildPath();if(!dayish&&pathObj){scene.remove(pathObj,pathMark);pathObj=pathMark=null;pathInfo=null}
    const lift=1+6*Math.max(0,Math.min(1,(SKY.sun.y+.04)/.14));hills.forEach(h=>h.m.material.color.setScalar(lift))}
  { // zoom: ease toward the target; the speed of the change drives the star streaks
    const prev=ZOOM.k;ZOOM.k+=(ZOOM.t-ZOOM.k)*.12;const f=ZOOM.base*ZOOM.k;
    if(Math.abs(camera.fov-f)>1e-4){camera.fov=f;camera.updateProjectionMatrix()}
    const w=reduced?0:(prev-ZOOM.k)/Math.max(.05,ZOOM.k)*7;ZOOM.warp+=(w-ZOOM.warp)*.35;streakMat.uniforms.uW.value=ZOOM.warp;
    stamp.visible=!document.body.classList.contains("pre");
    const fh=2*10*Math.tan(camera.fov/2*RAD);stamp.position.set(0,fh/2-fh*.06,-10);stamp.scale.copy(stamp.userData.s0).multiplyScalar(Math.tan(camera.fov/2*RAD)/Math.tan(36*RAD))}

  else $("recArc").setAttribute("stroke-dashoffset","153.9");

}
