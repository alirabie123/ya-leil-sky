<script type="module">
import * as THREE from "./three.module.min.js";
import {GLTFLoader} from "./GLTFLoader.js";
import {EffectComposer} from "./pp/EffectComposer.js";import {RenderPass} from "./pp/RenderPass.js";import {UnrealBloomPass} from "./pp/UnrealBloomPass.js";import {OutputPass} from "./pp/OutputPass.js";
/* ============ CONFIG ============ */
const CONFIG={
  title:"يا ليل",titleEn:"Ya Leil",
  releaseAr:"١٧ نوفمبر",releaseEn:"17 November",
  others:["مهرب","ازاي اسيب","النهاية","مساحات","خسرت نفسي","فاكراه"],   // faint, untappable letters of the other songs
  fallback:{lat:30.0444,lng:31.2357},   // Cairo, when location is refused
  declination:4.5,                      // magnetic → true north (degrees east, Cairo)
  clipSeconds:20,
  tonightHour:21,                       // daytime: mark where the moon will be at this hour tonight
  snippet:"ya-leil-snippet.m4a"         // 0:23–0:43 of the song, fades baked in; null = placeholder tone
};
/* ================================ */
const $=id=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const RAD=Math.PI/180;
const AD=s=>String(s).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const dirAA=(alt,az)=>new THREE.Vector3(Math.cos(alt)*Math.sin(az),Math.sin(alt),-Math.cos(alt)*Math.cos(az));   // three.js frame: x east, y up, -z north

/* ---------- astronomy (low precision, about a degree): sun, moon, galactic frame for any time and place ---------- */

const raOf=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(OBL)-Math.tan(b)*Math.sin(OBL),Math.cos(l));
const decOf=(l,b)=>Math.asin(Math.sin(b)*Math.cos(OBL)+Math.cos(b)*Math.sin(OBL)*Math.sin(l));
function skyAt(t){
  const d=t/DAYMS-.5+J1970-J2000,LST=RAD*(280.46061837+360.98564736629*d)+RAD*geo.lng,phi=geo.lat*RAD;
  const eq=(ra,dec)=>{const H=LST-ra,alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
    const az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi))+Math.PI;return dirAA(alt,az)};
  const M=RAD*(357.5291+.98560028*d),C=RAD*(1.9148*Math.sin(M)+.02*Math.sin(2*M)+.0003*Math.sin(3*M)),ls=M+C+RAD*102.9372+Math.PI;
  const sn=Math.sin,cs=Math.cos,Lp=RAD*(218.3165+13.17639648*d),Mp=RAD*(134.9634+13.06499295*d),Ms=RAD*(357.5291+.98560028*d),D=RAD*(297.8502+12.19074912*d),F=RAD*(93.2721+13.22935024*d);
  const lm=Lp+RAD*(6.289*sn(Mp)+1.274*sn(2*D-Mp)+.658*sn(2*D)+.214*sn(2*Mp)-.186*sn(Ms)-.114*sn(2*F)+.059*sn(2*D-2*Mp)+.057*sn(2*D-Ms-Mp)+.053*sn(2*D+Mp)+.046*sn(2*D-Ms)-.041*sn(Ms-Mp)-.035*sn(D)-.030*sn(Ms+Mp));
  const bm=RAD*(5.128*sn(F)+.281*sn(Mp+F)+.278*sn(Mp-F)+.173*sn(2*D-F)+.055*sn(2*D-Mp+F)+.046*sn(2*D-Mp-F)+.033*sn(2*D+F)+.017*sn(2*Mp+F));
  const par=Math.asin(6378.14/(385001-20905*cs(Mp)-3699*cs(2*D-Mp)-2956*cs(2*D)-570*cs(2*Mp)));   // seen from the ground, not the earth's centre

  return {sun:eq(raOf(ls,0),decOf(ls,0)),moon:dirAA(ma-par*Math.cos(ma),azOf(mg)),ngp:eq(192.85948*RAD,27.12825*RAD),gc:eq(266.40499*RAD,-28.93617*RAD)};
}

const canvas=$("c");

const LOW=17*RAD,withShow=s=>{s.show=s.moon;return s};
const TQ_=new URLSearchParams(location.search).get('t'),TQ=TQ_?Date.parse(TQ_):Date.now();
let SKY=withShow(skyAt(TQ));

/* sky dome: the cover's greys, a little lighter by day, with the real Milky Way photograph (ESO) always out */
const mwTex=new THREE.TextureLoader().load("milkyway-lo.jpg");mwTex.colorSpace=THREE.SRGBColorSpace;mwTex.wrapS=THREE.RepeatWrapping;mwTex.anisotropy=8;
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
  uniforms:{uSun:{value:SKY.sun},uMoon:{value:SKY.show},uNGP:{value:SKY.ngp},uGC:{value:SKY.gc},uMW:{value:mwTex},uEtch:{value:0},uMK:{value:0},uEnv:{value:1}},
  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 uSun,uMoon,uNGP,uGC;uniform sampler2D uMW;uniform float uEtch,uMK,uEnv;varying vec3 vD;
    float h1(float x){return fract(sin(x*127.1)*43758.5453);}
    void main(){vec3 d=normalize(vD);float h=d.y,ah=abs(h),sy=uSun.y;
      float night=clamp((-sy-.02)/.26,0.,1.),day=clamp((sy+.04)/.14,0.,1.);
      vec3 zenN=vec3(.0045,.0053,.0066),horN=vec3(.028,.032,.035),zenD=vec3(.02,.023,.024),horD=vec3(.075,.08,.074);   // the cover's palette: charcoal → sleeve grey-sage; by day only a shade lighter, so the stars stay out
      vec3 c=mix(mix(horN,zenN,smoothstep(0.,.75,ah)),mix(horD,zenD,smoothstep(0.,.6,ah)),day);
      vec2 sh=normalize(uSun.xz+1e-5),dh=normalize(d.xz+1e-5);float toward=max(dot(sh,dh),0.);
